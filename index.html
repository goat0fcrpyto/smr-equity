<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="SMR Equity">
<meta name="theme-color" content="#000000">
<title>SMR Equity</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #000;
    --fg: #f0f0f0;
    --muted: #7c7c80;
    --faint: #3d3d40;
    --line: rgba(255, 255, 255, 0.08);
    --line-hover: rgba(255, 255, 255, 0.22);
    --up: #4fae7c;
    --down: #c45c5c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    color: var(--fg);
    font-family: "Inter", -apple-system, "Segoe UI", Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    position: relative;
    overflow-x: hidden;
  }

  /* background: soft glow + fading grid */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background:
      radial-gradient(60% 45% at 50% 32%, rgba(255, 255, 255, 0.07), transparent 70%),
      linear-gradient(var(--line) 1px, transparent 1px) 0 0 / 64px 64px,
      linear-gradient(90deg, var(--line) 1px, transparent 1px) 0 0 / 64px 64px;
    -webkit-mask-image: radial-gradient(70% 60% at 50% 35%, #000 20%, transparent 85%);
    mask-image: radial-gradient(70% 60% at 50% 35%, #000 20%, transparent 85%);
    opacity: 0.55;
  }

  main {
    position: relative;
    z-index: 1;
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px 0 40px;
    text-align: center;
  }

  .logo {
    width: min(960px, 100vw);
    aspect-ratio: 16 / 9;
    object-fit: contain;
    display: block;
    mix-blend-mode: lighten;
    animation: rise 1.1s cubic-bezier(.2, .7, .2, 1) both;
  }

  .contact {
    margin-top: 0;
    display: grid;
    padding: 0 24px;
    grid-template-columns: repeat(2, minmax(0, 280px));
    gap: 16px;
    animation: rise 1.1s .25s cubic-bezier(.2, .7, .2, 1) both;
  }
  .card {
    display: flex;
    flex-direction: column;
    gap: 10px;
    align-items: center;
    padding: 20px 22px;
    text-align: center;
    text-decoration: none;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: rgba(255, 255, 255, 0.015);
    transition: border-color .25s, background .25s, transform .25s;
  }
  .card:hover {
    border-color: var(--line-hover);
    background: rgba(255, 255, 255, 0.04);
    transform: translateY(-2px);
  }
  .label {
    display: block;
    width: 100%;
    text-align: center;
    padding-left: 0.3em;
    font-size: 0.6rem;
    font-weight: 500;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--muted);
  }
  .mail {
    display: block;
    width: 100%;
    text-align: center;
    font-size: 0.86rem;
    font-weight: 300;
    letter-spacing: 0.02em;
    color: var(--fg);
  }

  /* ticker */
  .ticker {
    position: relative;
    z-index: 1;
    overflow: hidden;
    white-space: nowrap;
    border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line);
    background: rgba(0, 0, 0, 0.6);
    -webkit-mask-image: linear-gradient(90deg, transparent, #000 7%, #000 93%, transparent);
    mask-image: linear-gradient(90deg, transparent, #000 7%, #000 93%, transparent);
  }
  .track {
    display: inline-flex;
    padding: 15px 0;
    animation: scroll 70s linear infinite;
  }
  .ticker:hover .track { animation-play-state: paused; }
  .item {
    display: inline-flex;
    align-items: baseline;
    gap: 10px;
    padding: 0 30px;
    font-size: 0.7rem;
    letter-spacing: 0.06em;
    font-variant-numeric: tabular-nums;
  }
  .item .s { color: var(--muted); font-weight: 500; letter-spacing: 0.22em; }
  .item .p { color: var(--fg); font-weight: 400; }
  .item .c { color: var(--muted); }
  .item .c.up { color: var(--up); }
  .item .c.down { color: var(--down); }
  .item .c.up::before { content: "\25B2\00a0"; font-size: 0.55rem; }
  .item .c.down::before { content: "\25BC\00a0"; font-size: 0.55rem; }

  footer {
    position: relative;
    z-index: 1;
    display: flex;
    justify-content: space-between;
    gap: 12px 24px;
    flex-wrap: wrap;
    padding: 20px 28px;
    font-size: 0.6rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--faint);
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(14px); }
    to   { opacity: 1; transform: none; }
  }
  @keyframes scroll {
    from { transform: translateX(0); }
    to   { transform: translateX(-50%); }
  }
  @media (prefers-reduced-motion: reduce) {
    .track, .logo, .contact { animation: none; }
    .card { transition: none; }
  }
  @media (max-width: 640px) {
    main { padding: 16px 0 28px; }
    .contact {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      width: 100%;
      gap: 10px;
      padding: 0 14px;
    }
    .card { padding: 14px 6px; gap: 8px; border-radius: 8px; }
    .label { font-size: clamp(0.42rem, 1.9vw, 0.6rem); letter-spacing: 0.2em; padding-left: 0.2em; }
    .mail { font-size: clamp(0.5rem, 2.55vw, 0.86rem); letter-spacing: 0; }
    .item { padding: 0 20px; }
    footer { justify-content: center; text-align: center; font-size: 0.5rem; padding: 16px 14px; }
  }
</style>
</head>
<body>
  <main>
    <img class="logo" src="smr.png" alt="SMR Equity">

    <section class="contact">
      <a class="card" href="mailto:invest@smr-equity.com">
        <span class="label">Business Inquiries</span>
        <span class="mail">invest@smr-equity.com</span>
      </a>
      <a class="card" href="mailto:contact@smr-equity.com">
        <span class="label">Contact Inquiries</span>
        <span class="mail">contact@smr-equity.com</span>
      </a>
    </section>
  </main>

  <div class="ticker" aria-label="Market prices">
    <div class="track" id="track"></div>
  </div>

  <footer>
    <span>&copy; <span id="yr"></span> SMR Equity. All rights reserved.</span>
    <span>Market data is for information only. Not investment advice.</span>
  </footer>

<script>
  document.getElementById("yr").textContent = new Date().getFullYear();

  const COINS = [
    ["bitcoin", "BTC"], ["ethereum", "ETH"], ["solana", "SOL"], ["ripple", "XRP"],
    ["binancecoin", "BNB"], ["cardano", "ADA"], ["dogecoin", "DOGE"], ["avalanche-2", "AVAX"],
    ["chainlink", "LINK"], ["polkadot", "DOT"], ["sui", "SUI"], ["tron", "TRX"]
  ];
  const track = document.getElementById("track");

  const fmt = v => {
    const d = v >= 100 ? 0 : v >= 1 ? 2 : 4;
    return "$" + v.toLocaleString("en-US", { minimumFractionDigits: d, maximumFractionDigits: d });
  };

  function render(data) {
    const html = COINS.map(([id, s]) => {
      const d = data && data[id];
      if (!d) return `<span class="item"><span class="s">${s}</span><span class="p">&mdash;</span></span>`;
      const c = d.usd_24h_change ?? 0;
      return `<span class="item"><span class="s">${s}</span><span class="p">${fmt(d.usd)}</span><span class="c ${c >= 0 ? "up" : "down"}">${Math.abs(c).toFixed(2)}%</span></span>`;
    }).join("");
    track.innerHTML = html + html;
  }

  async function load() {
    try {
      const ids = COINS.map(c => c[0]).join(",");
      const r = await fetch(`https://api.coingecko.com/api/v3/simple/price?ids=${ids}&vs_currencies=usd&include_24hr_change=true`);
      if (!r.ok) throw new Error(r.status);
      render(await r.json());
    } catch (e) {
      if (!track.innerHTML) render(null);
    }
  }

  render(null);
  load();
  setInterval(load, 60000);
</script>
</body>
</html>
